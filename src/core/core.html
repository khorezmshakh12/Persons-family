<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persons Staff — Core v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PERSONS STAFF · AURORA v2 — tokenlar
   ===================================================================== */
:root{
  --bg:#f4f2ee; --side:#faf9f7; --card:#fff; --card2:#f4f1ec; --line:#ebe6de; --line2:#ddd6cb;
  --ink:#17161a; --muted:#6c6873; --faint:#a39fa8;
  --acc:#ff9f1c; --acc-ink:#1d1200; --acc-text:#a85a00; --acc-soft:rgba(255,159,28,.16);
  --ok:#0c7a3f; --ok2:#139a52; --ok-soft:#e4f4ea; --info:#1f6ab4; --info-soft:#e6f0fa; --bad:#c7322b; --bad-soft:#fbe5e3; --warn-soft:#fff1dc;
  --r:20px; --r-sm:10px;
  --shadow:0 1px 2px rgba(23,22,26,.04),0 12px 32px -12px rgba(23,22,26,.12);
  --hero:radial-gradient(60% 90% at 90% 10%,#ffd9a0 0%,transparent 60%),radial-gradient(50% 80% at 70% 100%,#ffb3a7 0%,transparent 60%),radial-gradient(60% 90% at 10% 0%,#fff1d6 0%,transparent 60%),linear-gradient(135deg,#fff6ea,#ffe7d6);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/20px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#dcd5ca;border-radius:10px;border:3px solid var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.tn{font-variant-numeric:tabular-nums}
.serif{font-family:"Instrument Serif",serif;font-weight:400}

/* ambient */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.42}
.amb i:nth-child(1){width:520px;height:520px;background:#ffd9a0;right:-120px;top:-160px;animation:ab1 26s ease-in-out infinite alternate}
.amb i:nth-child(2){width:440px;height:440px;background:#ffc2b4;left:30%;bottom:-220px;animation:ab2 32s ease-in-out infinite alternate}
.amb i:nth-child(3){width:360px;height:360px;background:#e9e1ff;left:14%;top:20%;opacity:.28;animation:ab3 38s ease-in-out infinite alternate}
@keyframes ab1{to{transform:translate(-180px,140px) scale(1.15)}}@keyframes ab2{to{transform:translate(160px,-120px) scale(.9)}}@keyframes ab3{to{transform:translate(120px,80px) scale(1.2)}}
.topbar{position:fixed;left:0;top:0;height:2px;z-index:100;background:linear-gradient(90deg,#ff9f1c,#ff6b5b);box-shadow:0 0 12px rgba(255,159,28,.7);width:0;opacity:0;pointer-events:none}
.topbar.go{animation:tb .7s var(--out) forwards}@keyframes tb{0%{width:0;opacity:1}60%{width:78%;opacity:1}100%{width:100%;opacity:0}}

/* ---------- SHELL ---------- */
.app{display:flex;height:100vh;position:relative;z-index:1}
.side{width:252px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;overflow:auto;position:relative}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.mark{width:36px;height:36px;border-radius:11px;background:#17161a;color:#ff9f1c;display:grid;place-items:center;font-weight:800;font-size:16px;position:relative;overflow:hidden;transition:transform .6s var(--spring)}
.mark::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:mk 5s 1.5s infinite}
@keyframes mk{0%,70%{transform:translateX(-120%)}90%,100%{transform:translateX(120%)}}
.brand:hover .mark{transform:rotate(-8deg) scale(1.06)}
.bname{font-weight:700;font-size:15px;line-height:18px}.bsub{font-size:12px;color:var(--faint)}
.role{margin:0 4px 14px;background:var(--card2);border-radius:12px;padding:3px;display:grid;grid-template-columns:1fr 1fr;position:relative}
.role button{position:relative;z-index:1;height:32px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);transition:color .25s}
.role button.on{color:var(--ink)}
.role .rk{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line);transition:transform .45s var(--spring)}
.role.x .rk{transform:translateX(100%)}
.nl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.ni{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;width:100%;text-align:left;overflow:hidden;transition:color .15s,background-color .15s}
.ni:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.ni .i{color:var(--faint);transition:transform .4s var(--spring),color .15s}
.ni:hover .i{transform:translateX(2px) rotate(-6deg) scale(1.08)}
.ni.on{color:var(--ink);font-weight:600}.ni.on .i{color:var(--acc-text)}
.ni .c{margin-left:auto;font-size:11px;font-weight:700;color:var(--faint)}
.ni .c.red{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.ni .b{margin-left:auto;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--acc);color:#1d1200}
.ni .b.dk{background:#17161a;color:#ff9f1c}
.sink{position:absolute;left:12px;right:12px;height:36px;top:0;border-radius:var(--r-sm);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px var(--line),0 8px 18px -12px rgba(0,0,0,.25);transition:transform .5s var(--spring),opacity .2s;pointer-events:none;opacity:0;z-index:0}
.sink::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 6px 0;border-top:1px solid var(--line)}
.me .n{font-weight:600;font-size:13px;line-height:16px}.me .r{font-size:12px;color:var(--faint)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px #fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(244,242,238,.72);backdrop-filter:saturate(1.4) blur(14px);position:relative;z-index:5;border-bottom:1px solid transparent;transition:border-color .3s,padding .3s}
.head.sc{border-bottom-color:var(--line);padding:10px 28px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);white-space:nowrap}.crumbs b{color:var(--ink);font-weight:600}
.sp{flex:1}
/* 3) QIDIRUV — matn aniq ko'rinadi */
.search{position:relative;width:min(420px,40vw)}
.search .box{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 14px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--faint);transition:border-color .2s,box-shadow .3s}
.search .box:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.search input{flex:1;border:0;outline:0;background:transparent;color:#17161a;font-size:14px;font-weight:500;caret-color:var(--acc);min-width:0}
.search input::placeholder{color:#a39fa8}
.search kbd{font:600 11px Inter;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}
.sres{position:absolute;left:0;right:0;top:48px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line),0 30px 70px -20px rgba(0,0,0,.35);overflow:hidden;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .35s var(--spring);z-index:50;max-height:440px;overflow-y:auto}
.search.open .sres{opacity:1;transform:none;pointer-events:auto}
.sg{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 14px 4px}
.si{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;text-align:left;font-size:13px;color:#17161a;transition:background-color .15s}
.si:hover,.si.sel{background:#fbf7f1}
.si .ic{width:28px;height:28px;border-radius:8px;background:var(--card2);display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.si.sel .ic{background:#17161a;color:#ff9f1c}
.si small{color:var(--faint);margin-left:auto;font-size:11px;white-space:nowrap}
.si mark{background:#ffe3b8;color:#17161a;border-radius:3px;padding:0 1px}
.sempty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.ib{width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);position:relative;transition:transform .3s var(--spring),color .2s}
.ib:hover{transform:translateY(-1px);color:var(--ink)}
.ib .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #fff;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px #fff,0 0 0 6px rgba(199,50,43,.15)}}
.stars{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:14px;background:var(--warn-soft);border:1px solid #ffdca3;font-weight:800;color:var(--acc-text)}
.view{flex:1;min-height:0;overflow:auto;padding:22px 28px 48px;position:relative}
.view.full{padding:0;overflow:hidden}

/* ---------- umumiy komponentlar ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative}
.pad{padding:20px 22px}
.ch2{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch2 h3{font-size:15px;font-weight:700;letter-spacing:-.01em}.ch2 small{font-size:12px;color:var(--faint);font-weight:500}
.ch2 .lnk{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}.ch2 .lnk:hover{color:var(--ink)}
.fx{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:italic 600 13px "Instrument Serif",serif;color:var(--muted);background:var(--card2);cursor:help;flex-shrink:0}
.fx:hover{background:#17161a;color:#ff9f1c}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.pl{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.pl.ok{background:var(--ok-soft);color:var(--ok)}.pl.warn{background:var(--warn-soft);color:var(--acc-text)}.pl.bad{background:var(--bad-soft);color:var(--bad)}.pl.info{background:var(--info-soft);color:var(--info)}.pl.mute{background:var(--card2);color:var(--muted)}.pl.dk{background:#17161a;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;font-weight:600;font-size:13px;white-space:nowrap;position:relative;overflow:hidden;transition:background-color .15s,transform .35s var(--spring),box-shadow .25s}
.btn:active{transform:scale(.97)}
.btn.p{background:#17161a;color:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}.btn.p:hover{background:#000}
.btn.s{background:#fff;border:1px solid var(--line)}.btn.s:hover{background:var(--card2);transform:translateY(-1px)}
.btn.a{background:var(--acc);color:#1d1200}
.btn.sm{height:32px;padding:0 11px;font-size:12px;border-radius:10px}
.btn .i{transition:transform .45s var(--spring)}.btn:hover .i{transform:rotate(-12deg) scale(1.1)}
.hb{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}.hb i{display:block;height:100%;border-radius:4px;transition:width .8s var(--ease)}
.seg{display:inline-flex;background:var(--card2);padding:3px;border-radius:10px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:opacity .2s}.leg span.off{opacity:.35}
.leg i{width:14px;height:3px;border-radius:2px}
.empty{padding:34px;text-align:center;color:var(--faint)}
.tip{position:fixed;z-index:120;pointer-events:none;background:#17161a;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:17px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);display:none;max-width:280px}
.tip b{font-weight:700}.tip .r{display:flex;justify-content:space-between;gap:14px;color:rgba(255,255,255,.7)}.tip .r span:last-child{color:#fff;font-weight:700}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tip code{font:500 11px ui-monospace,monospace;color:#ffd9a0}
.ch{position:relative;width:100%}.ch svg{display:block;width:100%;overflow:visible}
.ch .axis text{font:500 10px Inter;fill:#a39fa8}.ch .grid2 line{stroke:#f0ece5}
.ch .hit{fill:transparent;cursor:crosshair}.ch .xh{stroke:#17161a;stroke-width:1;opacity:0;pointer-events:none}.ch .hd{opacity:0;pointer-events:none}
.ch.hover .xh,.ch.hover .hd{opacity:1}
.toast{position:fixed;left:50%;bottom:24px;z-index:130;transform:translate(-50%,30px) scale(.9);opacity:0;background:#17161a;color:#fff;padding:12px 16px 14px 12px;border-radius:14px;font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 20px 50px -18px rgba(0,0,0,.6);transition:transform .5s var(--spring),opacity .3s;pointer-events:none;overflow:hidden}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.toast .ti{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,159,28,.18);color:#ffb547}
.toast .tp{position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,#ff9f1c,#ff6b5b);transform-origin:left}
.toast.show .tp{animation:tpr 2.6s linear forwards}@keyframes tpr{to{transform:scaleX(0)}}

/* ---------- motion ---------- */
.vin{animation:vin .55s var(--out) both}@keyframes vin{from{opacity:0;transform:translateX(var(--dx,0)) translateY(8px)}}
.rv{opacity:0}.rv.in{animation:rvIn .7s var(--out) both;animation-delay:var(--d,0ms)}
@keyframes rvIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.rs{animation:rs .5s var(--out) both;animation-delay:calc(var(--i,0)*35ms)}@keyframes rs{from{opacity:0;transform:translateY(10px)}}
.m-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--out) forwards;animation-delay:var(--d,150ms)}@keyframes draw{to{stroke-dashoffset:0}}
.m-gx{transform-origin:left center;animation:gx 1s var(--out) both;animation-delay:calc(150ms + var(--i,0)*50ms)}@keyframes gx{from{transform:scaleX(0)}}
.m-gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s var(--spring) both;animation-delay:calc(150ms + var(--i,0)*60ms)}@keyframes gy{from{transform:scaleY(0)}}
.lift{transition:transform .45s var(--out),box-shadow .45s var(--out)}
.lift:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(23,22,26,.04),0 24px 48px -20px rgba(23,22,26,.28)}
.spot::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(255,159,28,.95),rgba(255,107,91,.4) 35%,transparent 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s;pointer-events:none;z-index:3}
.spot:hover::after{opacity:1}
.rpl{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);opacity:.3;background:currentColor;animation:rpl .6s var(--out) forwards}@keyframes rpl{to{transform:scale(1);opacity:0}}
/* ---------- DASHBOARD ---------- */
.hero{background:var(--hero);border:0;padding:26px 28px;overflow:hidden;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;min-height:250px}
.hero .date{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--acc-text)}
.hero .date i{width:8px;height:8px;border-radius:50%;background:var(--ok2);box-shadow:0 0 0 3px rgba(19,154,82,.18);animation:pulse2 2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 6px rgba(19,154,82,0)}}
.hero h1{font-size:40px;line-height:46px;letter-spacing:-.03em;margin:10px 0 8px}
.hero h1 em{font-family:"Instrument Serif",serif;font-weight:400;background:linear-gradient(90deg,#17161a 0%,#17161a 40%,#ff9f1c 50%,#17161a 60%,#17161a 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s 1s infinite}
@keyframes shim{0%,60%{background-position:100% 0}100%{background-position:0 0}}
.hero p{font-size:15px;line-height:23px;color:#4d4852;max-width:520px}.hero p b{color:var(--ink)}
.hero .acts{display:flex;gap:10px;margin-top:18px}
.clock{justify-self:end;text-align:right}
.clock .t{font:400 64px/60px "Instrument Serif",serif;letter-spacing:-.02em;display:flex;align-items:flex-end;justify-content:flex-end;gap:2px}
.clock .t .sec{font-size:30px;line-height:36px;color:var(--acc-text);width:40px;text-align:left}
.clock small{display:block;font-size:12px;color:#7a6a5c;font-weight:600;margin-top:6px}
/* yangiliklar karuseli */
.news{overflow:hidden;min-height:250px;padding:0;color:#fff;border:0;background:#17161a}
.nw-tr{display:flex;height:100%;transition:transform .8s var(--out)}
.nw-s{overflow:hidden;min-width:100%;padding:22px 24px 56px;position:relative;display:flex;flex-direction:column;min-height:250px}
.nw-s::before{content:"";position:absolute;inset:0;background:var(--g);opacity:.95;transition:transform 8s linear;transform:scale(1.02)}
.nw-s.cur::before{transform:scale(1.12)}
.nw-s>*{position:relative}
.nw-s .cat{display:inline-flex;align-self:flex-start;height:24px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);font-size:11px;font-weight:700;align-items:center;gap:6px}
.nw-s h4{font-size:20px;line-height:26px;letter-spacing:-.01em;margin-top:auto;max-width:92%}
.nw-s p{font-size:13px;color:rgba(255,255,255,.78);margin-top:6px;line-height:19px}
.nw-s .meta{font-size:11px;color:rgba(255,255,255,.6);margin-top:10px;font-weight:600}
.nw-s.cur h4,.nw-s.cur p,.nw-s.cur .meta{animation:nwIn .8s var(--out) both}.nw-s.cur p{animation-delay:.08s}.nw-s.cur .meta{animation-delay:.16s}
@keyframes nwIn{from{opacity:0;transform:translateY(14px)}}
.nw-ctl{position:absolute;left:24px;right:24px;bottom:18px;display:flex;align-items:center;gap:6px;z-index:2}
.nw-ctl .bars{display:flex;gap:6px;flex:1}
.nw-ctl .bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;cursor:pointer}
.nw-ctl .bar i{display:block;height:100%;width:0;background:#fff}
.nw-ctl .bar.done i{width:100%}
.nw-ctl .bar.cur i{animation:nwp var(--dur,6s) linear forwards}
.news:hover .nw-ctl .bar.cur i{animation-play-state:paused}
@keyframes nwp{to{width:100%}}
.nw-ctl button{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;transition:background-color .2s,transform .3s var(--spring)}
.nw-ctl button:hover{background:rgba(255,255,255,.28);transform:scale(1.08)}
/* KPI */
.kpi{padding:18px 20px;min-height:150px;display:flex;flex-direction:column}
.kpi .l{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:500}
.kpi .l .ic{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.kpi .v{font-size:32px;line-height:38px;font-weight:800;letter-spacing:-.03em;margin-top:8px}

    <div class="drb"><div class="kvs"><div><small>Ijrochi</small><b>${av(t.who,22)} ${esc(P[t.who]?P[t.who].n:t.who)}</b></div><div><small>Bergan</small><b>${av(t.by,22)} ${esc(P[t.by]?P[t.by].n:t.by)}</b></div><div><small>Berilgan</small><b>${fmtDT(t.created)}</b></div><div><small>Muddat</small><b>${fmtDT(t.due)}</b></div>${t.doneAt?`<div><small>Bajarildi</small><b>${fmtDT(t.doneAt)} · ${t.doneAt<=t.due?'o\'z vaqtida':Math.ceil((t.doneAt-t.due)/H)+' soat kech'}</b></div>`:''}</div>
      ${t.n?`<div class="strat" style="margin-top:12px"><span class="cdl">Tavsif</span><p>${esc(t.n)}</p></div>`:''}
      <div class="acts2">${isMine&&t.st!=='done'?`<button class="btn p sm" id="dDone">${SI(IC.check)}Bajarildi</button>`:''}${isMine&&t.st==='todo'?`<button class="btn s sm" id="dStart">Boshladim</button>`:''}${(canEdit)&&t.st==='done'?`<button class="btn s sm" id="dReo">Qayta ochish</button>`:''}${canEdit?`<button class="btn s sm" id="dEdit">${SI(IC.edit)}Tahrirlash</button><button class="btn s sm dn" id="dDel">${SI(IC.trash)}O'chirish</button>`:''}</div>
      <span class="cdl" style="margin-top:18px">Izohlar · ${t.cm.length}</span><div class="cms">${t.cm.map(c=>`<div class="cm2 ${c.by===me?'me':''} ${isCEO(c.by)?'ceo':''}">${av(c.by,26)}<div><b>${short(c.by)}${isCEO(c.by)?' · CEO':''}</b><p>${esc(c.t)}</p><small>${fmtDT(c.at)}</small></div></div>`).join('')||'<div class="note">Hali izoh yo\'q. Rahbar savol beradi, ijrochi javob yozadi — hammasi shu yerda qoladi.</div>'}</div>
      <div class="cmf"><textarea class="ta" id="cmT" placeholder="${isMine?'Javob yozing…':'Izoh yoki savol yozing…'}"></textarea><button class="btn p sm" id="cmA">${SI(IC.msg)}Yuborish</button></div></div>`);
  const upd=()=>{ save(); render(true); taskDrawer(id); };
  a.querySelector('#cmA').onclick=()=>{ const v=a.querySelector('#cmT').value.trim(); if(!v) return; t.cm.push({by:me,at:Date.now(),t:v}); const to=[t.who,t.by,...new Set(t.cm.map(c=>c.by))].filter(k=>k!==me); notify([...new Set(to)],`${short(me)} «${t.t}» ga izoh: ${v.slice(0,60)}`,'tasks','task',t.id); log(`Izoh: ${t.t}`); upd(); };
  const q=s=>a.querySelector(s); if(q('#dDone')) q('#dDone').onclick=()=>{ doneTask(id); closeDrawer(); }; if(q('#dStart')) q('#dStart').onclick=()=>{ t.st='prog'; log(`Boshlandi: ${t.t}`); upd(); }; if(q('#dReo')) q('#dReo').onclick=()=>{ t.st='prog'; t.doneAt=null; log(`Qayta ochildi: ${t.t}`); notify(t.who,`Vazifa qayta ochildi: ${t.t}`,'tasks','task',t.id); upd(); };
  if(q('#dEdit')) q('#dEdit').onclick=()=>{ closeDrawer(true); taskForm(t); }; if(q('#dDel')) q('#dDel').onclick=()=>ask('Vazifa o\'chirilsinmi?',t.t,'O\'chirish',()=>{ S.tasks=S.tasks.filter(x=>x.id!==id); log(`Vazifa o'chirildi: ${t.t}`); save(); closeDrawer(); render(true); },1); }

/* ---------- INBOX: bildirishnomalar + tasdiqlar ---------- */
function approvals(){ const me=S.me, ceo=isCEO(me), out=[];
  Object.entries(S.kpi).forEach(([k,E])=>{ if(E.st==='sub'&&(ceo||P[k].boss===me)) out.push({type:'kpi',k,t:`${short(k)} KPI/Roadmap rejasini tasdiqqa yubordi`,s:`${E.kpis.length} KPI · ${E.road.length} bosqich · ${mLabel(E.m||S.month)}`}); });
  if(ceo) evalAll().forEach(x=>{ if(x.e.bonus&&!S.bonus[x.k]) out.push({type:'bonus',k:x.k,t:`${short(x.k)} — ${LV[x.e.lv][1]} ssenariy, bonus +${x.e.bonus}% kutmoqda`,s:`${kmln(x.e.bonusSum)} / oy · ${x.e.ks.filter(q=>q.lv===3).length}/${x.e.ks.length} KPI perfect`}); });
  S.leave.filter(l=>l.st==='pending'&&(ceo||P[l.k].boss===me||P[me].d==='hr')).forEach(l=>out.push({type:'leave',id:l.id,k:l.k,t:`${short(l.k)} ${l.type.toLowerCase()} so'radi`,s:`${fmtD(l.from)} – ${fmtD(l.to)} · ${Math.round((l.to-l.from)/D)+1} kun`}));
  return out; }
PAGES.inbox=el=>{ const me=S.me, ap=approvals(), N=S.notif.filter(n=>n.to===me), tab=S.iTab||'all', mine=S.leave.filter(l=>l.k===me).sort((a,b)=>b.at-a.at), myK=S.kpi[me];
  const TN={task:'Vazifa',kpi:'KPI reja',leave:'Ta\'til',bonus:'Bonus',sales:'Sotuv',info:'Info',hr:'HR'};
  el.innerHTML=`<div class="grid">
    <div class="card pad s12 nospot"><div class="tbar" style="margin:0">${tabs('iT',[['all','Barchasi',N.filter(n=>!n.read).length],['ap','Tasdiqlar',ap.length],['my','Mening so\'rovlarim']],tab)}<span class="sp"></span>${N.some(n=>!n.read)?`<button class="btn s sm" id="rdAll">${SI(IC.check)}Barchasini o'qilgan qilish</button>`:''}<button class="btn p sm" id="lvReq">${SI(IC.plus)}Ta'til / ruxsat so'rash</button></div></div>
    ${tab==='ap'||tab==='all'?`<div class="card pad ${tab==='all'?'s6':'s12'}">${hdr2('Tasdiqlashni kutmoqda',`${ap.length} ta · sizning qaroringiz kerak`,'',tab==='all'&&ap.length>5?`<button class="lnk" id="apAll">Barchasi (${ap.length}) →</button>`:'')}<div class="tl">${(tab==='all'?ap.slice(0,5):ap).map((a,i)=>`<div class="tli apr" style="grid-template-columns:34px 1fr auto"><span>${av(a.k,32)}</span><div><b>${esc(a.t)}</b><small>${esc(a.s)}</small></div><div class="apa">${a.type==='kpi'?`<button class="btn s sm" data-ap="${i}" data-act="open">Ko'rish</button><button class="btn s sm" data-ap="${i}" data-act="ret">Qaytarish</button><button class="btn p sm" data-ap="${i}" data-act="ok">Tasdiqlash</button>`:a.type==='bonus'?`<button class="btn s sm" data-ap="${i}" data-act="open">Ko'rish</button><button class="btn p sm" data-ap="${i}" data-act="ok">${SI(IC.star)}+${staffEval(a.k).bonus}% tasdiqlash</button>`:`<button class="btn s sm" data-ap="${i}" data-act="no">Rad</button><button class="btn p sm" data-ap="${i}" data-act="ok">Ruxsat</button>`}</div></div>`).join('')||empty('Tasdiq kutayotgan narsa yo\'q')}</div></div>`:''}
    ${tab==='all'?`<div class="card pad s6">${hdr2('Bildirishnomalar',`${N.length} ta · ${N.filter(n=>!n.read).length} o'qilmagan`)}<div class="tl">${N.slice(0,40).map(n=>`<button class="tli ntf ${n.read?'':'un'}" data-nt="${n.id}" style="grid-template-columns:auto 1fr auto"><span class="tic ${n.type==='task'?'info':n.type==='kpi'?'ok':n.type==='leave'?'warn':'mute'}">${SI(n.type==='task'?IC.tasks:n.type==='kpi'||n.type==='bonus'?IC.star:n.type==='leave'?IC.inbox:IC.bell)}</span><div><b>${esc(n.t)}</b><small>${TN[n.type]||n.type} · ${ago(n.at)}</small></div>${n.read?'':'<i class="undot"></i>'}</button>`).join('')||empty('Bildirishnoma yo\'q')}</div></div>`:''}
    ${tab==='my'?`<div class="card pad s6">${hdr2('Ta\'til / ruxsat so\'rovlarim','')}<div class="tl">${mine.map(l=>`<div class="tli" style="grid-template-columns:1fr auto"><div><b>${l.type} · ${fmtD(l.from)} – ${fmtD(l.to)}</b><small>${Math.round((l.to-l.from)/D)+1} kun · so'ralgan ${fmtD(l.at)}</small></div>${pill(l.st==='ok'?'Ruxsat berildi':l.st==='no'?'Rad etildi':'Kutmoqda',l.st==='ok'?'ok':l.st==='no'?'bad':'warn')}</div>`).join('')||empty('So\'rov yo\'q')}</div></div>
      <div class="card pad s6">${hdr2('KPI / Roadmap rejam','holati')}${myK?`<div class="tl"><div class="tli" style="grid-template-columns:1fr auto"><div><b>${mLabel(myK.m||S.month)} rejasi</b><small>${myK.kpis.length} KPI · ${myK.road.length} bosqich</small></div>${pill(myK.st==='ok'?'Tasdiqlangan':myK.st==='sub'?'Tasdiqda':myK.st==='ret'?'Qaytarilgan':'Qoralama',myK.st==='ok'?'ok':myK.st==='sub'?'warn':myK.st==='ret'?'bad':'mute')}</div></div>${myK.st!=='ok'&&myK.st!=='sub'?`<button class="btn p sm" data-go="hr" style="margin-top:10px">Rejani to'ldirish va yuborish</button>`:''}`:empty('Reja yo\'q','HR bo\'limida tuzing')}</div>`:''}</div>`;
  tabBind(el,'iT','iTab'); const aa=$('#apAll'); if(aa) aa.onclick=()=>{ S.iTab='ap'; save(); render(true); };
  el.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{ const n=S.notif.find(x=>x.id==b.dataset.nt); n.read=1; save(); if(n.type==='task'&&n.ref&&S.tasks.some(t=>t.id===n.ref)){ render(true); taskDrawer(n.ref); } else if(n.type==='kpi'&&n.ref&&S.kpi[n.ref]){ S.hrSel=n.ref; S.hrTab='kpi'; go('hr'); } else if(n.go&&n.go!=='inbox'&&can(n.go)) go(n.go); else render(true); });
  const ra=$('#rdAll'); if(ra) ra.onclick=()=>{ N.forEach(n=>n.read=1); save(); render(true); };
  $('#lvReq').onclick=()=>leaveForm();
  el.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{ const a=ap[+b.dataset.ap], act=b.dataset.act;
    if(a.type==='kpi'){ if(act==='open'){ S.hrSel=a.k; S.hrTab='kpi'; return go('hr'); } S.kpi[a.k].st=act==='ok'?'ok':'ret'; log(`${short(a.k)} KPI rejasi ${act==='ok'?'tasdiqlandi':'qaytarildi'}`); notify(a.k,`KPI/Roadmap rejangiz ${act==='ok'?'tasdiqlandi ✓':'qayta ko\'rish uchun qaytarildi'}`,'hr','kpi',a.k); toast(act==='ok'?'Reja tasdiqlandi':'Reja qaytarildi'); }
    else if(a.type==='bonus'){ if(act==='open'){ S.hrSel=a.k; S.hrTab='kpi'; return go('hr'); } const e=staffEval(a.k); S.bonus[a.k]=e.bonus; log(`${short(a.k)} ga +${e.bonus}% bonus tasdiqlandi (${kmln(e.bonusSum)})`); notify(a.k,`CEO sizga +${e.bonus}% KPI bonusini tasdiqladi — ${kmln(e.bonusSum)}`,'hr','bonus',a.k); const r=b.getBoundingClientRect(); confetti(r.left,r.top); toast('Bonus tasdiqlandi'); }
    else { const l=S.leave.find(x=>x.id===a.id); l.st=act==='ok'?'ok':'no'; log(`${short(l.k)} ${l.type.toLowerCase()} so'rovi ${act==='ok'?'tasdiqlandi':'rad etildi'}`); notify(l.k,`${l.type} so'rovingiz ${act==='ok'?'tasdiqlandi ✓':'rad etildi'} (${fmtD(l.from)}–${fmtD(l.to)})`,'inbox','leave'); }
    save(); render(true); });
};
function leaveForm(){ const me=S.me; modal({t:'Ta\'til / ruxsat so\'rovi',s:'rahbaringiz va HR ko\'radi',ic:IC.inbox,w:520,ok:'Yuborish',body:`<div class="frm" style="grid-template-columns:1fr 1fr">${F.sel('lT','Turi',['Ta\'til','Kasallik','Bir kunlik ruxsat','Masofadan ish'])}${F.inp('lR','Sabab / izoh','','text','ixtiyoriy')}${F.date('lF','Boshlanish',Date.now()+D)}${F.date('lTo','Tugash',Date.now()+D)}</div>`,
  onOk:bg=>{ const from=VD(bg,'lF'), to=VD(bg,'lTo'); if(!from||!to||to<from) return toast('Sanalarni to\'g\'ri kiriting'),false; const l={id:Date.now(),k:me,from,to,type:V(bg,'lT'),r:V(bg,'lR'),st:'pending',at:Date.now()}; S.leave.push(l);
    const to2=[bossOf(me),...Object.keys(P).filter(k=>P[k].d==='hr')]; notify(to2,`${short(me)} ${l.type.toLowerCase()} so'radi: ${fmtD(from)}–${fmtD(to)}`,'inbox','leave'); log(`${l.type} so'rovi yuborildi`); save(); render(true); toast('So\'rov yuborildi'); }}); }

const THK='persons-theme', gT=()=>{ try{ return localStorage.getItem(THK); }catch(e){ return null; } };
document.documentElement.dataset.theme=gT()||'light';
const cg=document.createElement('div'); cg.className='cglow'; document.body.prepend(cg);
let tx=innerWidth/2,ty=innerHeight/3,gx=tx,gy=ty; addEventListener('pointermove',e=>{ tx=e.clientX; ty=e.clientY; },{passive:true});
(function loop(){ gx+=(tx-gx)*.08; gy+=(ty-gy)*.08; cg.style.transform=`translate(${gx}px,${gy}px)`; requestAnimationFrame(loop); })();
function toggleTheme(x,y){ const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  const apply=()=>{ document.documentElement.dataset.theme=next; try{ localStorage.setItem(THK,next); }catch(e){} render(true); };
  if(!document.startViewTransition||RM){ apply(); return; } document.documentElement.classList.add('vt-theme');
  const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y)), t=document.startViewTransition(apply);
  t.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:750,easing:'cubic-bezier(.7,0,.2,1)',pseudoElement:'::view-transition-new(root)'}));
  t.finished.finally(()=>document.documentElement.classList.remove('vt-theme')); }
$('#thm').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); toggleTheme(r.left+r.width/2,r.top+r.height/2); };
document.addEventListener('keydown',e=>{ if((e.key==='t'||e.key==='T')&&!e.target.closest('input,textarea,select')&&!e.metaKey&&!e.ctrlKey){ const r=$('#thm').getBoundingClientRect(); toggleTheme(r.left+20,r.top+20); } });
/* 3D egilish */
document.addEventListener('pointermove',e=>{ const c=e.target.closest('.tilt'); $$('.tilt.mv').forEach(x=>{ if(x!==c){ x.classList.remove('mv'); x.style.removeProperty('--rx'); x.style.removeProperty('--ry'); } });
  if(!c||RM) return; const r=c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5, m=r.width>600?2:5;
  c.classList.add('mv'); c.style.setProperty('--ry',(px*m).toFixed(2)+'deg'); c.style.setProperty('--rx',(-py*m).toFixed(2)+'deg'); },{passive:true});
/* konfetti */
function confetti(x,y){ if(RM) return; const c=document.createElement('canvas'); c.className='cfx'; c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio; document.body.appendChild(c);
  const g=c.getContext('2d'); g.scale(devicePixelRatio,devicePixelRatio); const col=['#ff9f1c','#ff6b5b','#7a5af8','#139a52','#2477c9','#ffd166'];
  const Q=Array.from({length:130},()=>({x,y,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:col[Math.random()*6|0],sh:Math.random()<.5}));
  const t0=performance.now(); (function f(now){ const k=(now-t0)/1800; g.clearRect(0,0,innerWidth,innerHeight); Q.forEach(p=>{ p.vy+=.38; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; g.save(); g.globalAlpha=Math.max(0,1-k); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; if(p.sh) g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else { g.beginPath(); g.arc(0,0,p.s/2.6,0,7); g.fill(); } g.restore(); }); if(k<1) requestAnimationFrame(f); else c.remove(); })(t0); }

/* jonli bildirishnomalar — haqiqiy: menga kelgan o'qilmagan xabarlar */
let it, shown=new Set(); function island(){ const N=S.notif.filter(n=>n.to===S.me&&!n.read&&!shown.has(n.id)); const n=N[N.length-1]; if(!n) return; shown.add(n.id); const el=$('#isl'), by=(S.log.find(x=>x.t&&n.t.includes(short(x.by)))||{}).by;
  el.innerHTML=`${by?av(by,30):`<span class="tic info">${SI(IC.bell)}</span>`}<div class="tx"><small>${{task:'Vazifa',kpi:'KPI reja',leave:'Ta\'til',bonus:'Bonus',sales:'Sotuv',hr:'HR'}[n.type]||'Xabar'}</small><span>${esc(n.t)}</span></div><div class="wv"><i></i><i></i><i></i><i></i></div>`; el.onclick=()=>{ el.classList.remove('show'); n.read=1; save(); if(n.type==='task'&&n.ref&&S.tasks.some(t=>t.id===n.ref)){ render(true); taskDrawer(n.ref); } else go(can(n.go)?n.go:'inbox'); };
  el.classList.add('show'); const b=$('#bell'); b.classList.remove('wig'); void b.offsetWidth; b.classList.add('wig'); clearTimeout(it); it=setTimeout(()=>el.classList.remove('show'),5200); }
if(!RM){ setTimeout(island,5000); setInterval(island,20000); }
/* jonli lenta */
function tickFill(){ const c=salesCalc(), tg=tgtOf(S.month), ev=evalAll().map(x=>x.e), d=Math.max(1,mDays(S.month)-new Date().getDate()+1), fc=forecast();
  const I=[['Shartnoma',`<b>${c.w}</b> / ${tg.won||'—'} · prognoz <b>${fc.total}</b>${tg.won?` · kuniga <b>${Math.ceil(Math.max(0,tg.won-c.w)/d)}</b> kerak`:''}`,'sales'],['Lidlar',`<b>${c.n}</b> / ${tg.leads||'—'}`,'sales'],['CPL',`<b>${c.spend?kmln(c.cpl):'—'}</b>`,'sales'],['CAC',`<b>${c.w&&c.spend?kmln(c.cac):'—'}</b> · to'lovning ${pc(c.cacp)}`,'sales'],['Follow-up kechikkan',`<b>${c.late}</b> lid`,'sales'],
    ['Perfect ssenariy',`<b>${ev.filter(e=>e.lv===3).length}</b> / ${ev.length} xodim`,'hr'],['Bonus fondi',`<b>${kmln(ev.reduce((a,e)=>a+e.bonusSum,0))}</b>/oy`,'hr'],['Tasdiq kutmoqda',`<b>${approvals().length}</b>`,'inbox'],['Kechikkan vazifa',`<b>${S.tasks.filter(t=>t.st!=='done'&&t.due<Date.now()).length}</b>`,'tasks']];
  const h=I.map(i=>`<span class="ti2" data-g="${i[2]}">${i[0]}: ${i[1]}</span>`).join(''); $('#tt').innerHTML=h+h; $$('#tt .ti2').forEach(s=>s.onclick=()=>can(s.dataset.g)&&go(s.dataset.g)); }
function decorate(v){ tickFill(); v.querySelectorAll('.kpi,.hero,.tgt-c,.sm-i,.bonus').forEach(c=>c.classList.add('tilt'));
  const hero=v.querySelector('.hero'); if(hero&&!hero.querySelector('.mesh')) hero.insertAdjacentHTML('afterbegin','<div class="mesh"><i></i><i></i><i></i></div><span class="orb"></span>');
  v.querySelectorAll('.kpi.dk,.bn-s').forEach(c=>{ if(!c.querySelector(':scope>.rb2')){ c.classList.add('ring-b'); c.insertAdjacentHTML('beforeend','<span class="rb2"></span>'); } });
  v.querySelectorAll('.ch svg circle[r="4.5"]').forEach(c=>{ const r=c.cloneNode(); r.setAttribute('class','pr'); r.setAttribute('fill','none'); c.after(r); }); }
/* qidiruv */
const qEl=$('#q'), rEl=$('#sres'); let sSel=0,sL=[];
function sDraw(){ const q=qEl.value.trim().toLowerCase();
  const all=[...NAV.filter(x=>x.v&&can(x.v)).map(x=>({g:'Bo\'limlar',t:x.n,s:'bo\'lim',ic:IC[x.v],run:()=>go(x.v)})),...Object.keys(P).filter(k=>P[k].active!==0).map(k=>({g:'Xodimlar',t:P[k].n,s:P[k].r,av:k,run:()=>{ if(can('hr')){ S.hrTab='staff'; go('hr'); } staffDrawer(k); }})),
    ...S.tasks.filter(t=>isCEO(S.me)||t.who===S.me||t.by===S.me||subtree(S.me).includes(t.who)).map(t=>({g:'Vazifalar',t:t.t,s:short(t.who)+' · '+(t.st==='done'?'bajarildi':fmtDT(t.due)),ic:IC.tasks,run:()=>{ go('tasks'); taskDrawer(t.id); }})),
    ...(can('sales')?S.leads.filter(l=>!salesScope()||l.who===salesScope()).slice(-400).reverse().map(l=>({g:'Lidlar',t:l.n+(l.ph?' · '+l.ph:''),s:CH[l.ch].n+' · '+l.p+' · '+STN[l.st],ic:IC.sales,run:()=>{ go('sales'); leadDrawer(l.id); }})):[])];
  sL=q?all.filter(x=>(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,14):all.filter(x=>x.g==='Bo\'limlar');
  const mk=s=>{ if(!q) return esc(s); const i=s.toLowerCase().indexOf(q); return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); };
  let g=''; sSel=Math.min(sSel,Math.max(0,sL.length-1));
  rEl.innerHTML=sL.length?sL.map((x,i)=>`${x.g!==g?(g=x.g,`<div class="sg">${x.g}</div>`):''}<button class="si ${i===sSel?'sel':''}" data-i="${i}">${x.av?av(x.av,28):`<span class="ic">${SI(x.ic)}</span>`}<span>${mk(x.t)}</span><small>${esc(x.s)}</small></button>`).join(''):`<div class="sempty">Hech narsa topilmadi</div>`;
  rEl.querySelectorAll('.si').forEach(b=>b.onmousedown=e=>{ e.preventDefault(); run(+b.dataset.i); }); }
function run(i){ const x=sL[i]; if(!x) return; $('#search').classList.remove('open'); qEl.value=''; qEl.blur(); x.run(); }
qEl.onfocus=()=>{ $('#search').classList.add('open'); sDraw(); }; qEl.onblur=()=>setTimeout(()=>$('#search').classList.remove('open'),120); qEl.oninput=()=>{ sSel=0; sDraw(); };
qEl.onkeydown=e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); sSel=Math.min(sL.length-1,sSel+1); sDraw(); } else if(e.key==='ArrowUp'){ e.preventDefault(); sSel=Math.max(0,sSel-1); sDraw(); } else if(e.key==='Enter'){ e.preventDefault(); run(sSel); } else if(e.key==='Escape') qEl.blur(); };
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); qEl.focus(); } });
