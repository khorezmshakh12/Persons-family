# Production deploy pipeline (trigger: push to main).
#   1. verify  — typecheck + lint (the Docker build only runs `next build`)
#   2. migrate — apply any pending supabase/migrations/*.sql to the prod DB
#                BEFORE the new code goes live, so schema is never behind
#   3. deploy  — build the container from source and roll it out
#   4. smoke   — HTTP checks against the live site; a failure turns the
#                build red so a bad deploy is noticed immediately
#
# The Cloud Build trigger's service account needs roles/cloudsql.client and
# roles/run.admin.
#
# The DB password comes from Secret Manager (db-password) via
# availableSecrets below; the build service account has
# roles/secretmanager.secretAccessor on that secret.

substitutions:
  _INSTANCE: 'persons-staff-b01a83bd:europe-west3:persons-staff-db'
  _DB_NAME: 'app'
  _SERVICE: 'persons-staff-app'
  _REGION: 'europe-west3'
  _BASE_URL: 'https://www.persons-staffs.uz'

steps:
  - id: verify
    name: 'node:24'
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npx tsc --noEmit
        npx eslint

  - id: migrate
    name: 'node:24'
    entrypoint: bash
    secretEnv: ['DB_PASSWORD']
    args:
      - -ceu
      - |
        curl -sSL -o /workspace/cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.3/cloud-sql-proxy.linux.amd64
        chmod +x /workspace/cloud-sql-proxy
        # Backgrounded; it dies with the step container. No explicit kill,
        # and no plain shell variables (Cloud Build would try to resolve
        # them as build substitutions and fail).
        /workspace/cloud-sql-proxy "${_INSTANCE}" --port 5432 &
        sleep 8
        DATABASE_URL="postgres://postgres:$$DB_PASSWORD@127.0.0.1:5432/${_DB_NAME}" npx tsx scripts/migrate.ts

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --source=.
      - --region=${_REGION}
      # Request-based billing: CPU is throttled to ~0 once a response is
      # sent. Instance-based billing (--no-cpu-throttling) was ~80% of the
      # GCP bill. Server Actions therefore run their Telegram sends / syncs
      # inline via `settle()` (src/lib/settle.ts) instead of `after()`.
      # Explicit flag, not just omitted: `run deploy` keeps the old setting
      # when a flag is left out.
      - --cpu-throttling
      - --quiet

  - id: smoke
    name: 'node:24'
    entrypoint: bash
    args:
      - -ceu
      - BASE_URL="${_BASE_URL}" npx tsx scripts/smoke.ts

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY

# The Cloud SQL password comes from Secret Manager (the same secret the
# Cloud Run services read), never from this file.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/db-password/versions/latest
      env: DB_PASSWORD
