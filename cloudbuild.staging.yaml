# Staging deploy pipeline (trigger: push to the `staging` branch).
# Same shape as cloudbuild.yaml but targets the persons-staff-app-staging
# Cloud Run service and the app_staging database. Push here, verify it
# works, THEN merge to main.
#
# Requires substitution _DB_PASSWORD. Set _BASE_URL to the staging service
# URL once it exists (scripts/setup-staging.sh prints it).

substitutions:
  _INSTANCE: 'persons-staff-b01a83bd:europe-west3:persons-staff-db'
  _DB_NAME: 'app_staging'
  _SERVICE: 'persons-staff-app-staging'
  _REGION: 'europe-west3'
  _BASE_URL: '' # set to the staging run.app URL on the trigger
  _DB_PASSWORD: 'rnQTe2aILZonLj0NaWkV8XBb' # TODO: Secret Manager (see cloudbuild.yaml)

steps:
  - id: verify
    name: 'node:24'
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npx tsc --noEmit
        npx eslint

  - id: migrate
    name: 'node:24'
    entrypoint: bash
    args:
      - -ceu
      - |
        curl -sSL -o /workspace/cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.3/cloud-sql-proxy.linux.amd64
        chmod +x /workspace/cloud-sql-proxy
        /workspace/cloud-sql-proxy "${_INSTANCE}" --port 5432 &
        sleep 8
        DATABASE_URL="postgres://postgres:${_DB_PASSWORD}@127.0.0.1:5432/${_DB_NAME}" npx tsx scripts/migrate.ts

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --source=.
      - --region=${_REGION}
      - --quiet

  - id: smoke
    name: 'node:24'
    entrypoint: bash
    args:
      - -ceu
      - if [ -n "${_BASE_URL}" ]; then BASE_URL="${_BASE_URL}" npx tsx scripts/smoke.ts; else echo "skip smoke - _BASE_URL not set"; fi

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
